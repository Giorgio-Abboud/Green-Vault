version: "3.9"

services:
  ui:
    # For dev, use chainguard latest-dev image
    build: ./ui
    image: green-vault-ui
    ports: ["5173:5173"]
    environment:
      - VITE_CALC_BASE_URL=http://localhost:8000
    depends_on:
      analyzer:
        condition: service_started  # UI just needs calc to be up; optional

  analyzer:
    build: ./analyzer
    image: green-vault-analyzer
    environment:
      - BROKER_URL=amqp://guest:guest@rabbitmq:5672/
      - QUEUE_NAME=calc.success
    ports: ["8000:8000"]
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  internal:
    build: ./internal
    image: green-vault-internal
    environment:
      - BROKER_URL=amqp://guest:guest@rabbitmq:5672/
      - QUEUE_NAME=calc.success
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management
    ports: ["5672:5672","15672:15672"]
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
