version: "3.9"

services:
  ui:
    build: ./ui
    image: green-vault-ui
    ports: ["5173:5173"]
    environment:
      - VITE_CALC_BASE_URL=http://localhost:8000   # FastAPI
      - VITE_API_BASE_URL=http://localhost:8080    # Go API
    depends_on:
      analyzer:
        condition: service_started
      internal:
        condition: service_started

  analyzer:
    build: ./analyzer
    image: green-vault-analyzer
    ports: ["8000:8000"]
    restart: unless-stopped

  internal:
    build: ./internal
    image: green-vault-internal
    command: ["/app/server-api"]
    env_file:
      - ./internal/.env.docker
    environment:
      - API_PORT=8080
    extra_hosts:
      - "host.docker.internal:host-gateway"  # reach host Postgres
    ports: ["8080:8080"]
    restart: unless-stopped
